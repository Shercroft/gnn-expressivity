[project]
name = "gnn-expressivity"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "matplotlib>=3.11.1",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.0.5",
    "psutil>=7.2.2",
    "pyyaml>=6.0.3",
    "scikit-learn>=1.9.0",
    "scipy>=1.17.1",
    "torch>=2.14.0",
    "torch-geometric>=2.8.0.post1",
    "tqdm>=4.70.0",
]

[project.scripts]
gnn-expressivity = "gnn_expressivity:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.6",
]
